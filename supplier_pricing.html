<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplier Pricing Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:14px;color:#1a1a1a;background:#f0efe9;padding:1rem}
.gl-header{background:#1a1a1a;color:#fff;border-radius:12px;padding:1rem 1.5rem;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center}
.gl-logo{display:flex;align-items:center;gap:10px}
.gl-dot{width:28px;height:28px;background:#22c55e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.gl-name{font-size:17px;font-weight:700;letter-spacing:-.01em}
.gl-tagline{font-size:11px;color:#888;margin-top:1px}
.gl-module{font-size:12px;color:#22c55e;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
h1{font-size:19px;font-weight:600;margin-bottom:.25rem}
.subtitle{font-size:12px;color:#888;margin-bottom:1.25rem}
h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#777;margin-bottom:.75rem}
h3{font-size:12px;font-weight:600;color:#444;margin-bottom:.5rem;margin-top:1rem}
h3:first-of-type{margin-top:0}
.card{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:1.25rem;margin-bottom:.875rem}
label{font-size:12px;color:#666;display:block;margin-bottom:3px;margin-top:8px}
label:first-of-type{margin-top:0}
input,select{width:100%;padding:7px 10px;border:0.5px solid #ccc;border-radius:7px;font-size:13px;background:#fff;color:#1a1a1a;outline:none}
input:focus{border-color:#555}
input[readonly]{background:#f5f5f5;color:#888}

/* Supplier tabs */
.sup-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.25rem}
.sup-tab{padding:6px 16px;border:0.5px solid #ccc;border-radius:20px;font-size:13px;cursor:pointer;background:#fff;color:#555;font-weight:500}
.sup-tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.sup-panel{display:none}.sup-panel.active{display:block}

/* Brand tabs within supplier */
.brand-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem}
.brand-tab{padding:4px 12px;border:0.5px solid #ccc;border-radius:20px;font-size:12px;cursor:pointer;background:#fff;color:#555}
.brand-tab.active{background:#444;color:#fff;border-color:#444}
.brand-panel{display:none}.brand-panel.active{display:block}

/* Pricing table */
.price-tbl{width:100%;border-collapse:collapse;font-size:13px}
.price-tbl th{font-size:11px;color:#999;font-weight:600;text-transform:uppercase;padding:5px 8px;border-bottom:1px solid #eee;text-align:left}
.price-tbl th.num{text-align:right}
.price-tbl td{padding:6px 8px;border-bottom:0.5px solid #f5f5f5;vertical-align:middle}
.price-tbl tr:last-child td{border-bottom:none}
.price-tbl .cat-row td{background:#fafafa;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#bbb;padding:7px 8px 4px}
.price-tbl input{padding:4px 8px;font-size:13px;border:0.5px solid #ddd;border-radius:6px;text-align:right}
.price-tbl input:focus{border-color:#555;outline:none}
.price-tbl .proj-active input{background:#fffbeb;border-color:#f59e0b}
.proj-toggle{display:flex;align-items:center;gap:6px;cursor:pointer}
.proj-toggle input[type=checkbox]{width:auto;cursor:pointer}
.proj-badge{display:inline-block;padding:2px 7px;background:#fef3c7;color:#92400e;border-radius:10px;font-size:10px;font-weight:600;margin-left:6px}
.savings{font-size:11px;color:#2e7d32;margin-left:4px}

/* Status bar */
.status-bar{padding:.65rem 1rem;border-radius:8px;font-size:12px;margin-bottom:1rem}
.status-bar.saved{background:#f0faf0;color:#2e7d32;border:0.5px solid #a7d7a8}
.status-bar.unsaved{background:#fff8f0;color:#92400e;border:0.5px solid #fcd9a8}

.btn{border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;font-weight:500}
.btn-dark{background:#1a1a1a;color:#fff}.btn-dark:hover{background:#333}
.btn-outline{background:#fff;color:#1a1a1a;border:0.5px solid #ccc}.btn-outline:hover{background:#f5f5f5}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:7px}
.btn-row{display:flex;gap:8px;margin-top:.75rem}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}

.compare-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:1rem}
.compare-tbl th{background:#f5f4f0;padding:8px 10px;font-size:11px;font-weight:600;text-transform:uppercase;color:#888;border-bottom:1px solid #eee}
.compare-tbl td{padding:8px 10px;border-bottom:0.5px solid #f2f2f2}
.compare-tbl .best{color:#2e7d32;font-weight:600}
.compare-tbl .worst{color:#c0392b}
</style>
</head>
<body>

<div class="gl-header">
  <div class="gl-logo">
    <div class="gl-dot">🟢</div>
    <div>
      <div class="gl-name">Green Lit Software</div>
      <div class="gl-tagline">Empowering Roofing Entrepreneurs</div>
    </div>
  </div>
  <div class="gl-module">Supplier Pricing</div>
</div>
<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem">
  <div style="display:flex;gap:8px">
    <button class="btn btn-outline" onclick="showCompare()">📊 Compare Suppliers</button>
    <button class="btn btn-outline" onclick="prefillABC()">↺ Reload ABC Prices</button>
    <button class="btn btn-outline" onclick="prefillQXO()">↺ Reload QXO Prices</button>
    <button class="btn btn-dark" onclick="saveAll()">💾 Save All Prices</button>
  </div>
</div>

<div class="status-bar unsaved" id="status-bar">Prices not yet saved — click Save All Prices to push to estimator.</div>

<!-- SUPPLIER TABS -->
<div class="sup-tabs" id="supTabs"></div>
<div id="supPanels"></div>

<!-- COMPARE PANEL -->
<div id="compare-panel" class="card" style="display:none;margin-top:1rem">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">
    <h2 style="margin:0">Supplier Price Comparison</h2>
    <button class="btn btn-outline btn-sm" onclick="document.getElementById('compare-panel').style.display='none'">Close</button>
  </div>
  <p style="font-size:12px;color:#888;margin-bottom:.75rem">Green = best price available. Showing standard prices (or project price if active).</p>
  <div id="compare-body"></div>
</div>

<div class="btn-row">
  <button class="btn btn-dark" onclick="saveAll()" style="flex:1">💾 Save All Prices to Estimator</button>
  <button class="btn btn-outline" onclick="clearAll()">🗑 Clear All</button>
</div>

<div class="toast" id="toast"></div>

function setAltPref(supId,brandId,type,pref){
  const key=prefKey(supId,brandId,type);
  if(type==='iw') icewaterPrefs[key]=pref;
  else underlayPrefs[key]=pref;

  // Update button styles
  const brandLabel=BRAND_LABELS[brandId]||brandId;
  const alts=(type==='iw'?ALT_PRODUCTS[supId]?.icewater:ALT_PRODUCTS[supId]?.underlay)?.[brandLabel]||[];
  const cheapest=alts.slice().sort((a,b)=>a.price-b.price)[0];
  const prefix=type==='iw'?'iw':'ul';

  const mfrBtn=document.getElementById(`${prefix}btn-mfr-${supId}-${brandId}`);
  const chpBtn=document.getElementById(`${prefix}btn-cheapest-${supId}-${brandId}`);
  if(mfrBtn){mfrBtn.style.background=pref==='mfr'?'#1a1a1a':'#fff';mfrBtn.style.color=pref==='mfr'?'#fff':'#555';mfrBtn.style.borderColor=pref==='mfr'?'#1a1a1a':'#ccc';}
  if(chpBtn){chpBtn.style.background=pref==='cheapest'?'#2e7d32':'#fff';chpBtn.style.color=pref==='cheapest'?'#fff':'#555';chpBtn.style.borderColor=pref==='cheapest'?'#2e7d32':'#ccc';}

  // Update price field in the table to reflect chosen alternative
  const accKey=type==='iw'?'icewater':'underlay';
  const priceEl=document.getElementById(fid(supId,brandId,accKey,'std'));
  if(priceEl&&cheapest){
    if(pref==='cheapest') priceEl.value=cheapest.price.toFixed(2);
  }

  setStatus('unsaved','Preferences updated — click Save All Prices to apply.');
  toast(`✓ ${type==='iw'?'I&W':'Underlay'} set to ${pref==='mfr'?'manufacturer':'cheapest alternative'}`);
}

// Save/load prefs alongside prices
const _origCollect=collectAll;
function collectAll(){
  const data=_origCollect();
  data.__prefs={icewater:icewaterPrefs,underlay:underlayPrefs};
  return data;
}

const _origLoad=loadAll;
async function loadAll(){
  await _origLoad();
  try{
    const r=await window.storage.get('supplier-pricing');
    if(r){
      const data=JSON.parse(r.value);
      if(data.__prefs){
        icewaterPrefs=data.__prefs.icewater||{};
        underlayPrefs=data.__prefs.underlay||{};
      }
    }
  }catch(e){}
}

function switchSup(id){
  SUPPLIERS.forEach((s,i)=>document.querySelectorAll('.sup-tab')[i].classList.toggle('active',s.id===id));
  document.querySelectorAll('.sup-panel').forEach(p=>p.classList.toggle('active',p.id==='sp-'+id));
}
function switchBrand(supId,brandId){
  const sup=SUPPLIERS.find(s=>s.id===supId);
  sup.brands.forEach((b,i)=>{
    const tabs=document.querySelectorAll(`#btabs-${supId} .brand-tab`);
    if(tabs[i]) tabs[i].classList.toggle('active',b.id===brandId);
    const panel=document.getElementById(`bp-${supId}-${brandId}`);
    document.querySelectorAll(`#bpanels-${supId} .brand-panel`).forEach(p=>p.classList.remove('active'));
    if(panel) panel.classList.add('active');
  });
}

function toggleProject(togId,prjId,rowId){
  const on=document.getElementById(togId).checked;
  const row=document.getElementById(rowId);
  if(row) row.classList.toggle('proj-active',on);
  const prjEl=document.getElementById(prjId);
  if(prjEl){prjEl.disabled=!on;prjEl.style.opacity=on?'1':'0.4';}
}
function updateSavings(stdId,prjId,savId){
  const std=parseFloat(document.getElementById(stdId)?.value)||0;
  const prj=parseFloat(document.getElementById(prjId)?.value)||0;
  const savEl=document.getElementById(savId);
  if(!savEl)return;
  if(std>0&&prj>0&&prj<std){
    const pct=((std-prj)/std*100).toFixed(1);
    savEl.textContent=`-${pct}%`;savEl.style.color='#2e7d32';
  } else if(prj>=std&&prj>0){
    savEl.textContent='↑ higher';savEl.style.color='#c0392b';
  } else {savEl.textContent='';}
}

function activateAllProject(supId,brandId){
  const sup=SUPPLIERS.find(s=>s.id===supId);
  const brand=sup?.brands.find(b=>b.id===brandId);
  if(!brand)return;
  const allKeys=[...brand.products.map(p=>'prod__'+p.replace(/[^a-z0-9]/gi,'').toLowerCase()),
    ...(BRAND_ACC[brandId]||[]).map(a=>a.key)];
  allKeys.forEach(k=>{
    const togId=fid(supId,brandId,k,'tog');
    const prjId=fid(supId,brandId,k,'prj');
    const togEl=document.getElementById(togId);
    if(togEl&&!togEl.checked){togEl.checked=true;toggleProject(togId,prjId,'row-'+fid(supId,brandId,k,'std'));}
  });
}
function deactivateAllProject(supId,brandId){
  const sup=SUPPLIERS.find(s=>s.id===supId);
  const brand=sup?.brands.find(b=>b.id===brandId);
  if(!brand)return;
  const allKeys=[...brand.products.map(p=>'prod__'+p.replace(/[^a-z0-9]/gi,'').toLowerCase()),
    ...(BRAND_ACC[brandId]||[]).map(a=>a.key)];
  allKeys.forEach(k=>{
    const togId=fid(supId,brandId,k,'tog');
    const prjId=fid(supId,brandId,k,'prj');
    const togEl=document.getElementById(togId);
    if(togEl&&togEl.checked){togEl.checked=false;toggleProject(togId,prjId,'row-'+fid(supId,brandId,k,'std'));}
  });
}

// ── Collect all pricing data ─────────────────────────────────────────────────
function collectAll(){
  const data={};
  SUPPLIERS.forEach(sup=>{
    data[sup.id]={};
    sup.brands.forEach(brand=>{
      data[sup.id][brand.id]={products:{},accessories:{}};
      brand.products.forEach(prod=>{
        const key='prod__'+prod.replace(/[^a-z0-9]/gi,'').toLowerCase();
        const std=parseFloat(document.getElementById(fid(sup.id,brand.id,key,'std'))?.value)||0;
        const prj=parseFloat(document.getElementById(fid(sup.id,brand.id,key,'prj'))?.value)||0;
        const tog=document.getElementById(fid(sup.id,brand.id,key,'tog'))?.checked||false;
        data[sup.id][brand.id].products[prod]={std,prj,useProject:tog,effective:tog&&prj>0?prj:std};
      });
      (BRAND_ACC[brand.id]||[]).forEach(acc=>{
        const std=parseFloat(document.getElementById(fid(sup.id,brand.id,acc.key,'std'))?.value)||0;
        const prj=parseFloat(document.getElementById(fid(sup.id,brand.id,acc.key,'prj'))?.value)||0;
        const tog=document.getElementById(fid(sup.id,brand.id,acc.key,'tog'))?.checked||false;
        data[sup.id][brand.id].accessories[acc.key]={std,prj,useProject:tog,effective:tog&&prj>0?prj:std};
      });
    });
  });
  return data;
}

// ── Save to storage ──────────────────────────────────────────────────────────
async function saveAll(){
  const data=collectAll();
  try{
    await window.storage.set('supplier-pricing',JSON.stringify(data));
    setStatus('saved','✓ All prices saved and available to estimator — '+new Date().toLocaleTimeString());
    toast('✓ Prices saved to estimator');
  }catch(e){toast('Save failed — try again');}
}

// ── Load from storage ────────────────────────────────────────────────────────
async function loadAll(){
  try{
    const r=await window.storage.get('supplier-pricing');
    if(!r)return;
    const data=JSON.parse(r.value);
    SUPPLIERS.forEach(sup=>{
      if(!data[sup.id])return;
      sup.brands.forEach(brand=>{
        if(!data[sup.id][brand.id])return;
        const bd=data[sup.id][brand.id];
        brand.products.forEach(prod=>{
          const key='prod__'+prod.replace(/[^a-z0-9]/gi,'').toLowerCase();
          const pd=bd.products?.[prod];if(!pd)return;
          const stdEl=document.getElementById(fid(sup.id,brand.id,key,'std'));
          const prjEl=document.getElementById(fid(sup.id,brand.id,key,'prj'));
          const togEl=document.getElementById(fid(sup.id,brand.id,key,'tog'));
          if(stdEl&&pd.std) stdEl.value=pd.std.toFixed(2);
          if(prjEl&&pd.prj) prjEl.value=pd.prj.toFixed(2);
          if(togEl&&pd.useProject){togEl.checked=true;toggleProject(togEl.id,fid(sup.id,brand.id,key,'prj'),'row-'+fid(sup.id,brand.id,key,'std'));}
          updateSavings(fid(sup.id,brand.id,key,'std'),fid(sup.id,brand.id,key,'prj'),fid(sup.id,brand.id,key,'sav'));
        });
        (BRAND_ACC[brand.id]||[]).forEach(acc=>{
          const pd=bd.accessories?.[acc.key];if(!pd)return;
          const stdEl=document.getElementById(fid(sup.id,brand.id,acc.key,'std'));
          const prjEl=document.getElementById(fid(sup.id,brand.id,acc.key,'prj'));
          const togEl=document.getElementById(fid(sup.id,brand.id,acc.key,'tog'));
          if(stdEl&&pd.std) stdEl.value=pd.std.toFixed(2);
          if(prjEl&&pd.prj) prjEl.value=pd.prj.toFixed(2);
          if(togEl&&pd.useProject){togEl.checked=true;toggleProject(togEl.id,fid(sup.id,brand.id,acc.key,'prj'),'row-'+fid(sup.id,brand.id,acc.key,'std'));}
          updateSavings(fid(sup.id,brand.id,acc.key,'std'),fid(sup.id,brand.id,acc.key,'prj'),fid(sup.id,brand.id,acc.key,'sav'));
        });
      });
    });
    setStatus('saved','✓ Prices loaded from storage — '+new Date().toLocaleTimeString());
  }catch(e){setStatus('unsaved','Could not load saved prices.');}
}

// ── Compare panel ────────────────────────────────────────────────────────────
function showCompare(){
  const panel=document.getElementById('compare-panel');
  panel.style.display=panel.style.display==='none'?'block':'none';
  if(panel.style.display==='none')return;
  const data=collectAll();
  const body=document.getElementById('compare-body');
  body.innerHTML='';

  // Find brands available at multiple suppliers
  const brandSupMap={};
  SUPPLIERS.forEach(sup=>{
    sup.brands.forEach(brand=>{
      if(!brandSupMap[brand.id]) brandSupMap[brand.id]={label:brand.label,suppliers:[],products:brand.products};
      brandSupMap[brand.id].suppliers.push(sup.id);
    });
  });

  Object.entries(brandSupMap).forEach(([brandId,info])=>{
    if(info.suppliers.length<2)return; // only show multi-supplier brands
    const heading=document.createElement('h3');
    heading.textContent=info.label;heading.style.marginTop='1rem';
    body.appendChild(heading);

    const tbl=document.createElement('table');tbl.className='compare-tbl';
    const supHeaders=info.suppliers.map(sid=>SUPPLIERS.find(s=>s.id===sid)?.label||sid);
    tbl.innerHTML=`<thead><tr><th>Product</th>${supHeaders.map(l=>`<th>${l}</th>`).join('')}</tr></thead>`;
    const tbody=document.createElement('tbody');

    info.products.forEach(prod=>{
      const prices=info.suppliers.map(sid=>{
        const key='prod__'+prod.replace(/[^a-z0-9]/gi,'').toLowerCase();
        return data[sid]?.[brandId]?.products?.[prod]?.effective||0;
      });
      const minPrice=Math.min(...prices.filter(p=>p>0));
      const tr=document.createElement('tr');
      const cells=prices.map((p,i)=>{
        if(p===0) return '<td style="color:#ccc">—</td>';
        const isBest=p===minPrice;
        const isWorst=p>minPrice&&prices.filter(x=>x>0).length>1;
        return `<td class="${isBest?'best':isWorst?'worst':''}">${isBest?'★ ':''} $${p.toFixed(2)}</td>`;
      });
      tr.innerHTML=`<td>${prod}</td>${cells.join('')}`;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);body.appendChild(tbl);
  });

  if(!body.innerHTML) body.innerHTML='<p style="color:#aaa;font-size:13px">Enter prices above to compare across suppliers.</p>';
}

function prefillQXO(){
  Object.entries(QXO_PRICES).forEach(([brandId,data])=>{

      if(!prices.std) return;
      const key='prod__'+prod.replace(/[^a-z0-9]/gi,'').toLowerCase();
      const stdEl=document.getElementById(fid('qxo',brandId,key,'std'));
      if(stdEl&&!stdEl.value) stdEl.value=prices.std.toFixed(2);
    });
    Object.entries(data.accessories||{}).forEach(([accKey,prices])=>{
      if(!prices.std) return;
      const stdEl=document.getElementById(fid('qxo',brandId,accKey,'std'));

    });
  });
