<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roofing CRM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:14px;color:#1a1a1a;background:#f0efe9;padding:1rem}
.gl-header{background:#1a1a1a;color:#fff;border-radius:12px;padding:1rem 1.5rem;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center}
.gl-logo{display:flex;align-items:center;gap:10px}
.gl-dot{width:28px;height:28px;background:#22c55e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.gl-name{font-size:17px;font-weight:700;letter-spacing:-.01em}
.gl-tagline{font-size:11px;color:#888;margin-top:1px}
.gl-module{font-size:12px;color:#22c55e;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
h1{font-size:19px;font-weight:600}
h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#777;margin-bottom:.75rem}
.card{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:1.25rem;margin-bottom:.875rem}
input,select,textarea{width:100%;padding:7px 10px;border:0.5px solid #ccc;border-radius:7px;font-size:13px;background:#fff;color:#1a1a1a;outline:none}
input:focus,select:focus,textarea:focus{border-color:#555}
textarea{resize:vertical;min-height:56px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
label{font-size:12px;color:#666;display:block;margin-bottom:3px;margin-top:8px}
label:first-of-type{margin-top:0}

/* Nav tabs */
.nav{display:flex;gap:6px;margin-bottom:1.25rem;border-bottom:1px solid #e0e0e0;padding-bottom:.75rem}
.nav-btn{padding:7px 18px;border:0.5px solid #ccc;border-radius:20px;font-size:13px;cursor:pointer;background:#fff;color:#555;font-weight:500}
.nav-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}

/* Status badges */
.status{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.status-draft{background:#f0efe9;color:#666}
.status-sent{background:#dbeafe;color:#1d4ed8}
.status-approved{background:#dcfce7;color:#15803d}
.status-lost{background:#fee2e2;color:#991b1b}
.status-expired{background:#fef3c7;color:#92400e}

/* Stats cards */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:1rem}
.stat-card{background:#fff;border:0.5px solid #ddd;border-radius:10px;padding:.875rem 1rem}
.stat-card .sv{font-size:22px;font-weight:700;margin-top:2px}
.stat-card .sl{font-size:11px;color:#888}

/* Quote table */
.q-table{width:100%;border-collapse:collapse;font-size:13px}
.q-table th{text-align:left;padding:8px 10px;border-bottom:1px solid #eee;font-size:11px;font-weight:600;color:#999;text-transform:uppercase;white-space:nowrap}
.q-table td{padding:8px 10px;border-bottom:0.5px solid #f5f5f5;vertical-align:middle}
.q-table tr:hover td{background:#fafafa;cursor:pointer}
.q-table tr:last-child td{border-bottom:none}

/* Customer table */
.c-table{width:100%;border-collapse:collapse;font-size:13px}
.c-table th{text-align:left;padding:8px 10px;border-bottom:1px solid #eee;font-size:11px;font-weight:600;color:#999;text-transform:uppercase}
.c-table td{padding:8px 10px;border-bottom:0.5px solid #f5f5f5;vertical-align:middle}
.c-table tr:hover td{background:#fafafa;cursor:pointer}

/* Quote detail modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;padding:1.5rem;position:relative}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:20px;cursor:pointer;color:#888;line-height:1}

/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.filter-chip{padding:4px 12px;border:0.5px solid #ccc;border-radius:20px;font-size:12px;cursor:pointer;background:#fff;color:#555}
.filter-chip.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}

.btn{border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:500}
.btn-dark{background:#1a1a1a;color:#fff}.btn-dark:hover{background:#333}
.btn-outline{background:#fff;color:#1a1a1a;border:0.5px solid #ccc}.btn-outline:hover{background:#f5f5f5}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn-green{background:#15803d;color:#fff}.btn-green:hover{background:#166534}
.btn-red{background:#991b1b;color:#fff}.btn-red:hover{background:#7f1d1d}

.empty{text-align:center;padding:3rem;color:#aaa;font-size:13px}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap input{padding-left:30px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#aaa;font-size:13px}
.note-pill{display:inline-block;background:#fef3c7;color:#92400e;border-radius:6px;font-size:11px;padding:2px 7px;margin-top:3px}
</style>
</head>
<body>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
  <div>
    <h1>🟢 Project Green Lit — CRM</h1>
    <div style="font-size:12px;color:#888;margin-top:2px">Quote history · Customer database · Pipeline tracking</div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-outline" onclick="exportCSV()">⬇ Export CSV</button>
    <button class="btn btn-dark" onclick="showTab('new-customer')">+ New Customer</button>
  </div>
</div>

<!-- NAV -->
<div class="nav">
  <button class="nav-btn active" id="nav-dashboard" onclick="showTab('dashboard')">Dashboard</button>
  <button class="nav-btn" id="nav-quotes" onclick="showTab('quotes')">All Quotes</button>
  <button class="nav-btn" id="nav-customers" onclick="showTab('customers')">Customers</button>
  <button class="nav-btn" id="nav-new-customer" onclick="showTab('new-customer')">+ New Customer</button>
</div>

<!-- DASHBOARD -->
<div id="tab-dashboard">
  <div class="stats" id="stats-cards"></div>
  <div class="g2">
    <div class="card">
      <h2>Recent Quotes</h2>
      <div id="recent-quotes"></div>
    </div>
    <div class="card">
      <h2>Pipeline by Status</h2>
      <div id="pipeline-chart"></div>
    </div>
  </div>
</div>

<!-- ALL QUOTES -->
<div id="tab-quotes" style="display:none">
  <div class="card">
    <div class="filters">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="q-search" placeholder="Search by customer, address, quote #..." oninput="renderQuotes()">
      </div>
      <select id="q-sort" onchange="renderQuotes()" style="width:auto">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="value-desc">Highest value</option>
        <option value="value-asc">Lowest value</option>
      </select>
    </div>
    <div class="filters" id="status-filters"></div>
    <table class="q-table" id="quotes-table">
      <thead><tr>
        <th>Quote #</th><th>Customer</th><th>Address</th>
        <th>Date</th><th>System</th><th>Value</th>
        <th>Status</th><th>Actions</th>
      </tr></thead>
      <tbody id="quotes-body"></tbody>
    </table>
    <div class="empty" id="quotes-empty" style="display:none">No quotes found.</div>
  </div>
</div>

<!-- CUSTOMERS -->
<div id="tab-customers" style="display:none">
  <div class="card">
    <div class="filters">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="c-search" placeholder="Search customers..." oninput="renderCustomers()">
      </div>
    </div>
    <table class="c-table" id="customers-table">
      <thead><tr>
        <th>Name</th><th>Phone</th><th>Email</th><th>City</th>
        <th>Quotes</th><th>Last quote</th><th>Actions</th>
      </tr></thead>
      <tbody id="customers-body"></tbody>
    </table>
    <div class="empty" id="customers-empty" style="display:none">No customers yet.</div>
  </div>
</div>

<!-- NEW / EDIT CUSTOMER -->
<div id="tab-new-customer" style="display:none">
  <div class="card">
    <h2 id="cust-form-title">New Customer</h2>
    <input type="hidden" id="edit-cust-id">
    <div class="g3">
      <div><label>First name</label><input id="cf-first" placeholder="First name"></div>
      <div><label>Last name</label><input id="cf-last" placeholder="Last name"></div>
      <div><label>Phone</label><input id="cf-phone" placeholder="(780) 000-0000"></div>
    </div>
    <div class="g3">
      <div><label>Email</label><input id="cf-email" type="email" placeholder="email@example.com"></div>
      <div><label>Address</label><input id="cf-address" placeholder="Street address"></div>
      <div><label>City</label><input id="cf-city" placeholder="City"></div>
    </div>
    <div style="margin-top:10px"><label>Notes</label><textarea id="cf-notes" placeholder="Any notes about this customer..."></textarea></div>
    <div style="display:flex;gap:8px;margin-top:1rem">
      <button class="btn btn-dark" onclick="saveCustomer()" style="flex:1">Save Customer</button>
      <button class="btn btn-outline" onclick="showTab('customers')">Cancel</button>
    </div>
  </div>
</div>

<!-- QUOTE DETAIL MODAL -->
<div class="modal-bg" id="quote-modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────────
let quotes=[];
let customers=[];
let activeStatusFilter='all';

const STATUS_META={
  draft:    {label:'Draft',    cls:'status-draft'},
  sent:     {label:'Sent',     cls:'status-sent'},
  approved: {label:'Approved', cls:'status-approved'},
  lost:     {label:'Lost',     cls:'status-lost'},
  expired:  {label:'Expired',  cls:'status-expired'},
};

// ── Storage helpers ───────────────────────────────────────────────────────────
async function loadAll(){
  try{
    const qr=await window.storage.get('crm-quotes');
    if(qr) quotes=JSON.parse(qr.value);
    const cr=await window.storage.get('crm-customers');
    if(cr) customers=JSON.parse(cr.value);
  }catch(e){}
  renderDashboard();
  renderQuotes();
  renderCustomers();
  buildStatusFilters();
  checkIncomingQuote();
}

async function saveQuotes(){
  try{await window.storage.set('crm-quotes',JSON.stringify(quotes));}catch(e){}
}
async function saveCustomers(){
  try{await window.storage.set('crm-customers',JSON.stringify(customers));}catch(e){}
}

// ── Check for incoming quote from estimator ───────────────────────────────────
async function checkIncomingQuote(){
  try{
    const r=await window.storage.get('crm-incoming-quote');
    if(!r) return;
    const q=JSON.parse(r.value);
    await window.storage.delete('crm-incoming-quote');
    receiveQuote(q);
  }catch(e){}
}

function receiveQuote(q){
  // Check if quote # already exists — update it
  const idx=quotes.findIndex(x=>x.quoteNum===q.quoteNum);
  if(idx>=0){
    quotes[idx]={...quotes[idx],...q,updatedAt:new Date().toISOString()};
    toast('✓ Quote '+q.quoteNum+' updated');
  } else {
    quotes.unshift({...q,status:'draft',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
    toast('✓ Quote '+q.quoteNum+' saved to CRM');
    // Auto-create customer if not exists
    autoCreateCustomer(q);
  }
  saveQuotes();
  renderDashboard();renderQuotes();renderCustomers();buildStatusFilters();
}

function autoCreateCustomer(q){
  if(!q.customer) return;
  const exists=customers.find(c=>(c.first+' '+c.last).toLowerCase()===q.customer.toLowerCase()||c.phone===q.phone||c.email===q.email);
  if(exists){
    // Link quote to customer
    if(!exists.quoteNums) exists.quoteNums=[];
    if(!exists.quoteNums.includes(q.quoteNum)) exists.quoteNums.push(q.quoteNum);
    saveCustomers();return;
  }
  const parts=q.customer.trim().split(' ');
  const newCust={
    id:'cust-'+Date.now(),
    first:parts[0]||'',last:parts.slice(1).join(' ')||'',
    phone:q.phone||'',email:q.email||'',
    address:q.address||'',city:q.city||'',
    notes:'',quoteNums:[q.quoteNum],
    createdAt:new Date().toISOString(),
  };
  customers.unshift(newCust);
  saveCustomers();
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function renderDashboard(){
  const total=quotes.length;
  const approved=quotes.filter(q=>q.status==='approved');
  const sent=quotes.filter(q=>q.status==='sent');
  const totalVal=quotes.reduce((s,q)=>s+(q.value||0),0);
  const approvedVal=approved.reduce((s,q)=>s+(q.value||0),0);
  const winRate=total>0?(approved.length/total*100).toFixed(0):0;

  document.getElementById('stats-cards').innerHTML=`
    <div class="stat-card"><div class="sl">Total quotes</div><div class="sv">${total}</div></div>
    <div class="stat-card"><div class="sl">Pending (sent)</div><div class="sv" style="color:#1d4ed8">${sent.length}</div></div>
    <div class="stat-card"><div class="sl">Approved</div><div class="sv" style="color:#15803d">${approved.length}</div></div>
    <div class="stat-card"><div class="sl">Win rate</div><div class="sv">${winRate}%</div></div>
    <div class="stat-card"><div class="sl">Approved value</div><div class="sv">$${fmtNum(approvedVal)}</div></div>`;

  // Recent quotes
  const recent=quotes.slice(0,6);
  const rDiv=document.getElementById('recent-quotes');
  if(!recent.length){rDiv.innerHTML='<div class="empty">No quotes yet.</div>';return;}
  rDiv.innerHTML=recent.map(q=>`
    <div onclick="openQuote('${q.quoteNum}')" style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid #f0f0f0;cursor:pointer">
      <div>
        <div style="font-weight:500;font-size:13px">${q.customer||'—'}</div>
        <div style="font-size:11px;color:#888">${q.quoteNum} · ${q.address||''}${q.city?', '+q.city:''}</div>
      </div>
      <div style="text-align:right">
        <span class="status ${STATUS_META[q.status]?.cls||'status-draft'}">${STATUS_META[q.status]?.label||q.status}</span>
        <div style="font-size:12px;font-weight:600;margin-top:2px">${q.value?'$'+fmtNum(q.value):''}</div>
      </div>
    </div>`).join('');

  // Pipeline chart
  const byStatus={};
  Object.keys(STATUS_META).forEach(s=>byStatus[s]=0);
  quotes.forEach(q=>{ if(byStatus[q.status]!==undefined) byStatus[q.status]++; });
  const maxCount=Math.max(...Object.values(byStatus),1);
  document.getElementById('pipeline-chart').innerHTML=Object.entries(byStatus).map(([s,count])=>`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <span class="status ${STATUS_META[s].cls}" style="width:72px;text-align:center">${STATUS_META[s].label}</span>
      <div style="flex:1;background:#f0efe9;border-radius:4px;height:18px;overflow:hidden">
        <div style="width:${count/maxCount*100}%;background:#1a1a1a;height:100%;border-radius:4px;transition:width .3s"></div>
      </div>
      <span style="font-size:13px;font-weight:600;width:24px;text-align:right">${count}</span>
    </div>`).join('');
}

// ── Quotes list ───────────────────────────────────────────────────────────────
function buildStatusFilters(){
  const div=document.getElementById('status-filters');
  const counts={all:quotes.length};
  Object.keys(STATUS_META).forEach(s=>{counts[s]=quotes.filter(q=>q.status===s).length;});
  div.innerHTML=[['all','All'],...Object.entries(STATUS_META).map(([k,v])=>[k,v.label])].map(([k,label])=>`
    <button class="filter-chip${activeStatusFilter===k?' active':''}" onclick="setStatusFilter('${k}')">
      ${label} <span style="opacity:.6">(${counts[k]||0})</span>
    </button>`).join('');
}

function setStatusFilter(s){activeStatusFilter=s;buildStatusFilters();renderQuotes();}

function renderQuotes(){
  const q=document.getElementById('q-search').value.toLowerCase();
  const sort=document.getElementById('q-sort').value;
  let list=quotes.filter(x=>{
    const matchStatus=activeStatusFilter==='all'||x.status===activeStatusFilter;
    const matchQ=!q||[x.quoteNum,x.customer,x.address,x.city,x.estimator].filter(Boolean).join(' ').toLowerCase().includes(q);
    return matchStatus&&matchQ;
  });
  if(sort==='date-asc') list.sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  else if(sort==='date-desc') list.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  else if(sort==='value-desc') list.sort((a,b)=>(b.value||0)-(a.value||0));
  else if(sort==='value-asc') list.sort((a,b)=>(a.value||0)-(b.value||0));

  const tbody=document.getElementById('quotes-body');
  const empty=document.getElementById('quotes-empty');
  tbody.innerHTML='';
  empty.style.display=list.length?'none':'block';
  list.forEach(q=>{
    const tr=document.createElement('tr');
    tr.onclick=()=>openQuote(q.quoteNum);
    tr.innerHTML=`
      <td style="font-weight:500;white-space:nowrap">${q.quoteNum||'—'}</td>
      <td>${q.customer||'—'}</td>
      <td style="font-size:12px;color:#888">${q.address||''}${q.city?', '+q.city:''}</td>
      <td style="white-space:nowrap;font-size:12px">${fmtDate(q.createdAt)}</td>
      <td style="font-size:12px">${q.systems||'—'}</td>
      <td style="font-weight:600;white-space:nowrap">${q.value?'$'+fmtNum(q.value):'—'}</td>
      <td><select onclick="event.stopPropagation()" onchange="updateStatus('${q.quoteNum}',this.value)" style="font-size:12px;padding:3px 6px;width:auto">
        ${Object.entries(STATUS_META).map(([k,v])=>`<option value="${k}" ${q.status===k?'selected':''}>${v.label}</option>`).join('')}
      </select></td>
      <td onclick="event.stopPropagation()" style="white-space:nowrap">
        <button class="btn btn-outline btn-sm" onclick="openQuote('${q.quoteNum}')">View</button>
        <button class="btn btn-outline btn-sm" style="margin-left:4px;color:#c0392b" onclick="deleteQuote('${q.quoteNum}')">✕</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

function updateStatus(quoteNum,status){
  const q=quotes.find(x=>x.quoteNum===quoteNum);
  if(q){q.status=status;q.updatedAt=new Date().toISOString();}
  saveQuotes();renderDashboard();buildStatusFilters();
  // Auto-push to job board when approved
  if(status==='approved'&&q) pushToJobBoard(q);
  toast('Status updated → '+STATUS_META[status]?.label);
}

async function pushToJobBoard(q){
  try{
    // Load existing jobs
    const jr=await window.storage.get('jobs-data');
    const jobs=jr?JSON.parse(jr.value):[];
    const exists=jobs.find(j=>j.quoteNum===q.quoteNum);
    if(exists) return; // already on board
    jobs.unshift({
      id:'job-'+Date.now()+Math.random(),
      quoteNum:q.quoteNum,customer:q.customer||'',
      address:q.address||'',city:q.city||'',
      system:q.systems||'',value:q.value||0,
      estimator:q.estimator||'',stage:'scheduled',
      crew:'',pm:'',startDate:'',endDate:'',
      notes:q.description||'',checklist:{},
      activity:[{text:'Job created from approved quote '+q.quoteNum,time:new Date().toISOString()}],
      createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),
    });
    await window.storage.set('jobs-data',JSON.stringify(jobs));
    toast('✓ Job automatically added to Project Board');
  }catch(e){}
}

async function deleteQuote(quoteNum){
  if(!confirm('Delete quote '+quoteNum+'? This cannot be undone.')) return;
  quotes=quotes.filter(q=>q.quoteNum!==quoteNum);
  await saveQuotes();renderDashboard();renderQuotes();buildStatusFilters();
  toast('Quote deleted');
}

// ── Quote detail modal ────────────────────────────────────────────────────────
function openQuote(quoteNum){
  const q=quotes.find(x=>x.quoteNum===quoteNum);
  if(!q) return;
  const cust=customers.find(c=>c.quoteNums?.includes(quoteNum));
  document.getElementById('modal-content').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem">
      <div>
        <div style="font-size:17px;font-weight:700">${q.customer||'Unknown customer'}</div>
        <div style="font-size:12px;color:#888;margin-top:2px">${q.quoteNum} · ${fmtDate(q.createdAt)}</div>
      </div>
      <span class="status ${STATUS_META[q.status]?.cls||''}" style="font-size:13px">${STATUS_META[q.status]?.label||q.status}</span>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;font-size:13px">
      <div><span style="color:#888">Address</span><br><strong>${q.address||'—'}${q.city?', '+q.city:''}</strong></div>
      <div><span style="color:#888">Estimator</span><br><strong>${q.estimator||'—'}</strong></div>
      <div><span style="color:#888">Phone</span><br><strong>${q.phone||'—'}</strong></div>
      <div><span style="color:#888">Email</span><br><strong>${q.email||'—'}</strong></div>
    </div>

    ${q.description?`<div style="background:#f5f4f0;border-radius:8px;padding:.75rem;font-size:13px;margin-bottom:1rem;color:#555">${q.description}</div>`:''}

    <div style="margin-bottom:1rem">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#aaa;margin-bottom:8px">Roofing Systems</div>
      <div style="font-size:13px">${q.systems||'—'}</div>
    </div>

    ${q.structures?.length?`
    <div style="margin-bottom:1rem">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#aaa;margin-bottom:8px">Structures</div>
      ${q.structures.map(s=>`<div style="background:#f5f4f0;border-radius:8px;padding:8px 12px;margin-bottom:4px;font-size:13px">
        <strong>${s.type}</strong> — ${s.area} sq ft · ${s.pred} · ${s.sqW} sq (with waste)
      </div>`).join('')}
    </div>`:''}

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1rem">
      <div style="background:#f0faf0;border-radius:8px;padding:.75rem;text-align:center">
        <div style="font-size:11px;color:#888">Materials</div>
        <div style="font-size:16px;font-weight:700;color:#15803d">${q.matTotal?'$'+fmtNum(q.matTotal):'—'}</div>
      </div>
      <div style="background:#f0f4ff;border-radius:8px;padding:.75rem;text-align:center">
        <div style="font-size:11px;color:#888">Labour</div>
        <div style="font-size:16px;font-weight:700;color:#1d4ed8">${q.labTotal?'$'+fmtNum(q.labTotal):'—'}</div>
      </div>
      <div style="background:#f0efe9;border-radius:8px;padding:.75rem;text-align:center">
        <div style="font-size:11px;color:#888">Selling price</div>
        <div style="font-size:16px;font-weight:700">${q.value?'$'+fmtNum(q.value):'—'}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem;font-size:13px">
      <div><span style="color:#888">Markup</span> <strong>${q.markup||'—'}</strong></div>
      <div><span style="color:#888">Margin</span> <strong>${q.margin||'—'}</strong></div>
      <div><span style="color:#888">Job type</span> <strong>${q.jobType||'—'}</strong></div>
      <div><span style="color:#888">Delivery</span> <strong>${q.delivery||'—'}</strong></div>
    </div>

    <div style="margin-bottom:1rem">
      <label style="margin-top:0">Status</label>
      <select onchange="updateStatus('${q.quoteNum}',this.value)" style="margin-top:4px">
        ${Object.entries(STATUS_META).map(([k,v])=>`<option value="${k}" ${q.status===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
    </div>

    <div style="margin-bottom:1rem">
      <label style="margin-top:0">Internal notes</label>
      <textarea id="modal-notes" placeholder="Add notes about this quote...">${q.notes||''}</textarea>
    </div>

    <div style="display:flex;gap:8px">
      <button class="btn btn-dark" onclick="saveModalNotes('${q.quoteNum}')" style="flex:1">Save Notes</button>
      <button class="btn btn-outline" onclick="closeModal()">Close</button>
    </div>`;
  document.getElementById('quote-modal').style.display='flex';
}

function saveModalNotes(quoteNum){
  const q=quotes.find(x=>x.quoteNum===quoteNum);
  if(q){q.notes=document.getElementById('modal-notes').value;q.updatedAt=new Date().toISOString();}
  saveQuotes();toast('Notes saved');
}
function closeModal(){document.getElementById('quote-modal').style.display='none';}

// ── Customers ─────────────────────────────────────────────────────────────────
function renderCustomers(){
  const q=document.getElementById('c-search').value.toLowerCase();
  let list=customers.filter(c=>!q||[c.first,c.last,c.phone,c.email,c.city].filter(Boolean).join(' ').toLowerCase().includes(q));
  const tbody=document.getElementById('customers-body');
  const empty=document.getElementById('customers-empty');
  tbody.innerHTML='';
  empty.style.display=list.length?'none':'block';
  list.forEach(c=>{
    const qCount=c.quoteNums?.length||0;
    const lastQ=c.quoteNums?.length?quotes.find(q=>q.quoteNum===c.quoteNums[c.quoteNums.length-1]):null;
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td style="font-weight:500">${c.first} ${c.last}</td>
      <td>${c.phone||'—'}</td>
      <td style="font-size:12px">${c.email||'—'}</td>
      <td>${c.city||'—'}</td>
      <td style="text-align:center;font-weight:600">${qCount}</td>
      <td style="font-size:12px;color:#888">${lastQ?fmtDate(lastQ.createdAt):'—'}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-outline btn-sm" onclick="editCustomer('${c.id}')">Edit</button>
        <button class="btn btn-outline btn-sm" style="margin-left:4px;color:#c0392b" onclick="deleteCustomer('${c.id}')">✕</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

function saveCustomer(){
  const id=document.getElementById('edit-cust-id').value;
  const cust={
    id:id||'cust-'+Date.now(),
    first:document.getElementById('cf-first').value.trim(),
    last:document.getElementById('cf-last').value.trim(),
    phone:document.getElementById('cf-phone').value.trim(),
    email:document.getElementById('cf-email').value.trim(),
    address:document.getElementById('cf-address').value.trim(),
    city:document.getElementById('cf-city').value.trim(),
    notes:document.getElementById('cf-notes').value.trim(),
    quoteNums:[],
    createdAt:new Date().toISOString(),
  };
  if(!cust.first&&!cust.last){alert('Please enter at least a first or last name.');return;}
  if(id){
    const idx=customers.findIndex(c=>c.id===id);
    if(idx>=0){cust.quoteNums=customers[idx].quoteNums||[];customers[idx]=cust;}
  } else {
    customers.unshift(cust);
  }
  saveCustomers();renderCustomers();showTab('customers');
  toast(id?'Customer updated':'Customer saved');
}

function editCustomer(id){
  const c=customers.find(x=>x.id===id);if(!c)return;
  document.getElementById('edit-cust-id').value=c.id;
  document.getElementById('cf-first').value=c.first||'';
  document.getElementById('cf-last').value=c.last||'';
  document.getElementById('cf-phone').value=c.phone||'';
  document.getElementById('cf-email').value=c.email||'';
  document.getElementById('cf-address').value=c.address||'';
  document.getElementById('cf-city').value=c.city||'';
  document.getElementById('cf-notes').value=c.notes||'';
  document.getElementById('cust-form-title').textContent='Edit Customer';
  showTab('new-customer');
}

async function deleteCustomer(id){
  if(!confirm('Delete this customer?')) return;
  customers=customers.filter(c=>c.id!==id);
  await saveCustomers();renderCustomers();toast('Customer deleted');
}

// ── Export ────────────────────────────────────────────────────────────────────
function exportCSV(){
  if(!quotes.length){toast('No quotes to export');return;}
  const headers=['Quote #','Customer','Address','City','Date','Systems','Value','Status','Estimator','Job Type'];
  const rows=quotes.map(q=>[
    q.quoteNum,q.customer,q.address,q.city,
    fmtDate(q.createdAt),q.systems,q.value||'',
    q.status,q.estimator,q.jobType
  ].map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(','));
  const csv=[headers.join(','),...rows].join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='roofing-quotes-'+new Date().toISOString().split('T')[0]+'.csv';
  a.click();
  toast('CSV exported');
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function showTab(name){
  ['dashboard','quotes','customers','new-customer'].forEach(t=>{
    document.getElementById('tab-'+t).style.display=t===name?'block':'none';
    document.getElementById('nav-'+t)?.classList.toggle('active',t===name);
  });
  if(name==='new-customer'&&!document.getElementById('edit-cust-id').value){
    // Clear form for new customer
    ['cf-first','cf-last','cf-phone','cf-email','cf-address','cf-city','cf-notes'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('edit-cust-id').value='';
    document.getElementById('cust-form-title').textContent='New Customer';
  }
}

function fmtNum(n){return Number(n).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtDate(iso){if(!iso)return '—';const d=new Date(iso);return d.toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'});}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// ── Init ──────────────────────────────────────────────────────────────────────
loadAll();

// Poll for incoming quotes every 5 seconds
setInterval(checkIncomingQuote, 5000);
</script>
